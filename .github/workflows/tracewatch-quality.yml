name: tracewatch-quality

on:
  push:
    branches: ["main"]
    paths:
      - "app.py"
      - "analyzer.py"
      - "tests/**"
      - "requirements*.txt"
      - ".pylintrc"
      - ".github/workflows/tracewatch-quality.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "app.py"
      - "analyzer.py"
      - "tests/**"
      - "requirements*.txt"
      - ".pylintrc"
      - ".github/workflows/tracewatch-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Run Pylint
        run: python -m pylint app.py analyzer.py tests/test_analyzer.py
      - name: Run Bandit
        run: python -m bandit -r app.py analyzer.py